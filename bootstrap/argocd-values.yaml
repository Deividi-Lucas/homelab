# Argo CD enxuto para um Raspberry Pi (chart argo-cd 10.18.0 / Argo CD v3.6.1).
# O acesso é pelo Ingress do Tailscale (platform/argocd-ingress.yaml), que termina o TLS.
# Nomes curtos (argocd-server, argocd-repo-server...), que o Ingress e a documentação usam.
fullnameOverride: argocd
configs:
  params:
    server.insecure: true
  cm:
    # Faz o Argo CD esperar cada Application filha ficar saudável antes da próxima "sync-wave".
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
server:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
repoServer:
  resources:
    requests: {cpu: 25m, memory: 96Mi}
    limits: {memory: 256Mi}
controller:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
