apiVersion: v1
kind: ConfigMap
metadata:
  name: notepi
data:
  NOTEPI_DB: /dados/notas.db
  NOTEPI_BACKUP_DIR: /backup
  NOTEPI_BACKUP_EXIGIR_MONTAGEM: "0"
  NOTEPI_BACKUP_MARCADOR: "1"
  # Nome do tailnet (painel do Tailscale → DNS). É público nos registros de certificados.
  NOTEPI_HOSTS: notepi.tail8fb69e.ts.net
  # Logins do Tailscale autorizados. Vazio = qualquer aparelho que a ACL deixar passar (ver README).
  NOTEPI_USUARIOS: ""
