# SUBSTITUIR: gerado com kubeseal a partir do seu rclone.conf (ver README, "Segredos").
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: notepi-rclone
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    rclone.conf: SUBSTITUIR_PELO_KUBESEAL
  template:
    metadata:
      name: notepi-rclone
