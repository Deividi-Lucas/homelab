apiVersion: apps/v1
kind: Deployment
metadata:
  name: notepi
spec:
  replicas: 1            # SQLite: um processo escrevendo, nunca mais de uma réplica
  strategy:
    type: Recreate       # derruba a versão antiga antes de subir a nova
  selector:
    matchLabels:
      app.kubernetes.io/name: notepi
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notepi
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notepi
          image: ghcr.io/deividi-lucas/notepi
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: notepi
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Por TCP: uma checagem HTTP esbarraria na lista NOTEPI_HOSTS.
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - {name: dados, mountPath: /dados}
            - {name: backup, mountPath: /backup, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: notepi-dados
        - name: backup
          hostPath:
            path: /mnt/backup
            type: Directory
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
