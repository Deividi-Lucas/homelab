apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notepi
labels:
  - pairs:
      app.kubernetes.io/name: notepi
    includeSelectors: false
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - cronjob-backup.yaml
  # sealedsecret-rclone.yaml entra aqui quando a nuvem for configurada (README, passo 6)
images:
  # A CI do NotePi troca newTag e digest a cada versão publicada.
  - name: ghcr.io/deividi-lucas/notepi
    newTag: sha-31ac9e9
    digest: sha256:113805e3c9d3d5f5a970afa36a27e99a76a2b7cb3a423fe78053a33edf1504f3
