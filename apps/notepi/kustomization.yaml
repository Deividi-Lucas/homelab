apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notepi
labels:
  - pairs:
      app.kubernetes.io/name: notepi
    includeSelectors: false
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - cronjob-backup.yaml
  - sealedsecret-rclone.yaml
images:
  # A CI do NotePi troca newTag e digest a cada versão publicada.
  - name: ghcr.io/deividi-lucas/notepi
    newTag: sha-inicial
