apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notepi
labels:
  - pairs:
      app.kubernetes.io/name: notepi
    includeSelectors: false
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - cronjob-backup.yaml
  # sealedsecret-rclone.yaml entra aqui quando a nuvem for configurada (README, passo 6)
images:
  # A CI do NotePi troca newTag e digest a cada versão publicada.
  - name: ghcr.io/deividi-lucas/notepi
    newTag: sha-ec0eea5
    digest: sha256:5a04a6cf6a0b08967e381749b41c394b9e5b62ef5f556c7244bc15bee43ec7fb
