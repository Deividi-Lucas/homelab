apiVersion: apps/v1
kind: Deployment
metadata:
  name: finpi
spec:
  # 0 durante a migração do banco do Pi 3 (README do homelab, "Migrar o FinPi"); depois 1.
  # SQLite: nunca mais de uma réplica.
  replicas: 0
  strategy:
    type: Recreate       # derruba a versão antiga antes de subir a nova
  selector:
    matchLabels:
      app.kubernetes.io/name: finpi
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finpi
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      # o FinPi fecha o SQLite com calma ao receber SIGTERM
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finpi
          image: ghcr.io/deividi-lucas/finpi
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: finpi
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - {name: dados, mountPath: /dados}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: finpi-dados
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
