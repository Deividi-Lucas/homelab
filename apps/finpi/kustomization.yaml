apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finpi
labels:
  - pairs:
      app.kubernetes.io/name: finpi
    includeSelectors: false
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - cronjob-backup.yaml
  # sealedsecret-rclone.yaml entra aqui quando a nuvem for configurada (README, passo 6)
images:
  # A CI do FinPi troca newTag e digest a cada versão publicada.
  - name: ghcr.io/deividi-lucas/finpi
    newTag: sha-63aca7a
    digest: sha256:7917a719456d17455cd361a40cb9ec77c86ccfd19c40da38b466f2b90b6faeee
