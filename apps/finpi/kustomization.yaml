apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finpi
labels:
  - pairs:
      app.kubernetes.io/name: finpi
    includeSelectors: false
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - cronjob-backup.yaml
  # sealedsecret-rclone.yaml entra aqui quando a nuvem for configurada (README, passo 6)
images:
  # A CI do FinPi troca newTag e digest a cada versão publicada.
  - name: ghcr.io/deividi-lucas/finpi
    newTag: sha-3fcdb93
    digest: sha256:be7f7ec69825a4afd77c2e9fdd2a796ed4fd0e4d1e5d00233c6b974d4b6f88d5
