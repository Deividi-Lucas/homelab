apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finpi
labels:
  - pairs:
      app.kubernetes.io/name: finpi
    includeSelectors: false
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - cronjob-backup.yaml
  # sealedsecret-rclone.yaml entra aqui quando a nuvem for configurada (README, passo 6)
images:
  # A CI do FinPi troca newTag e digest a cada versão publicada.
  - name: ghcr.io/deividi-lucas/finpi
    newTag: sha-0660608
    digest: sha256:3098aeaf868e830c10940cd18e6b4e36deb8850115560958e024ec25751fc20f
