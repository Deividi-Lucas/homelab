# Web: só recebe do proxy do Tailscale e não sai para lugar nenhum.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finpi-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - port: 8080
  egress: []
---
# Backup: não recebe nada; sai só para DNS e HTTPS (rclone → Google Drive).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finpi-backup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backup
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 443, protocol: TCP}
