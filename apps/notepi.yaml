apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notepi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/Deividi-Lucas/homelab.git
    targetRevision: main
    path: apps/notepi
  destination:
    server: https://kubernetes.default.svc
    namespace: notepi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
